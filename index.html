<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: 하단 Safe Area 대응 (UX_SPEC §19) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <title>Fitlog</title>

  <!-- iOS 홈 화면 PWA 메타 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitlog" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 상단 고정 타이머 (타이머 동작 시에만 표시) — UX_SPEC §4.2/§9 -->
  <div id="timer-bar" class="timer-bar" hidden>⏱ <span id="timer-bar-time">00:00</span></div>

  <!-- 화면 유지용 무음 루프 video (타이머 동안 재생) — CLAUDE §5.2 -->
  <video id="keep-awake" muted playsinline loop hidden
         src="assets/video/keep-awake.mp4"
         style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>

  <!-- 알림음 (오디오 언락 후 재생) — DATA_SPEC §11 -->
  <audio id="rest-end-audio" src="assets/sounds/rest-end.mp3" preload="auto"></audio>

  <!-- 뷰 컨테이너: 탭에 따라 하나만 표시 -->
  <main id="app">
    <section id="view-today"  class="view"><!-- TODO(Phase1): 오늘 화면 (app.js) --></section>
    <section id="view-history" class="view" hidden><!-- TODO(Phase3): 기록 화면 --></section>
    <section id="view-guide"   class="view" hidden><!-- TODO(Phase3): 가이드/커스터마이징 --></section>
    <section id="view-ai"      class="view" hidden><!-- TODO(Phase4): AI 코치 --></section>
    <section id="view-settings" class="view" hidden><!-- TODO: 설정 (타이머·알림 테스트·백업) --></section>
  </main>

  <!-- 하단 네비게이션 (최대 5개) — UX_SPEC §2 -->
  <nav id="tabbar" class="tabbar">
    <button class="tab" data-view="today" aria-current="true">오늘</button>
    <button class="tab" data-view="history">기록</button>
    <button class="tab" data-view="guide">가이드</button>
    <button class="tab" data-view="ai">AI 코치</button>
    <button class="tab" data-view="settings">설정</button>
  </nav>

  <script>
    // iOS 홈화면 PWA는 첫 실행 때 앱 화면을 상태바 높이만큼 짧게 잡고, 스크롤이 한 번 일어나야 전체 높이로 늘린다.
    // 내용이 짧아 스크롤이 안 되는 화면(유산소만 있는 오늘 탭 등)에선 그대로 남으므로,
    // 짧게 잡힌 걸 감지하면 투명 여백을 잠깐 붙여 1px 스크롤했다 되돌려 재계산을 유도한다.
    (function () {
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      var screenH = Math.max(screen.height, screen.width);
      var vp = window.FitlogVP = { first: window.innerHeight, screen: screenH, nudges: 0, now: window.innerHeight };
      var busy = false, tries = 0;
      function isShort() {
        if (!standalone || window.innerWidth > window.innerHeight) return false;
        var d = screenH - window.innerHeight;
        return d >= 20 && d <= 100;
      }
      function nudge() {
        vp.now = window.innerHeight;
        if (busy || tries >= 6 || !isShort()) return;
        var a = document.activeElement;
        if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
        busy = true; tries++; vp.nudges++;
        var y = window.scrollY;
        var spacer = document.createElement("div");
        spacer.style.cssText = "position:absolute;left:0;top:0;width:1px;height:calc(100vh + 200px);pointer-events:none;visibility:hidden";
        document.body.appendChild(spacer);
        window.scrollTo(0, y + 1);
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          window.scrollTo(0, y);
          spacer.remove();
          busy = false;
          vp.now = window.innerHeight;
        }); });
      }
      ["load", "pageshow", "resize"].forEach(function (ev) { window.addEventListener(ev, nudge); });
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { tries = 0; nudge(); [300, 1000].forEach(function (ms) { setTimeout(nudge, ms); }); } });
      [0, 150, 500, 1200, 2500].forEach(function (ms) { setTimeout(nudge, ms); });
    })();
  </script>

  <!-- 모듈 로드. 의존: db → evaluation → timer → backup → ai-bridge → app -->
  <script src="./db.js"></script>
  <script src="./evaluation.js"></script>
  <script src="./timer.js"></script>
  <script src="./backup.js"></script>
  <script src="./ai-bridge.js"></script>
  <script src="./catalog-data.js"></script>
  <script src="./heatmap.js"></script>
  <script src="./app.js"></script>
  <script>
    // Service Worker 등록 (배포 시 HTTPS 필요)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        if (navigator.serviceWorker.controller) {
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => { if (refreshing) return; refreshing = true; window.location.reload(); });
        }
        navigator.serviceWorker.register("service-worker.js").then((reg) => {
          reg.update();
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          reg.addEventListener("updatefound", () => {
            const nw = reg.installing; if (!nw) return;
            nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage({ type: "SKIP_WAITING" }); });
          });
        }).catch(console.error);
      });
    }
  </script>
</body>
</html>
