<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: 하단 Safe Area 대응 (UX_SPEC §19) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111318" />
  <title>Fitlog</title>

  <!-- iOS 홈 화면 PWA 메타 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitlog" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 상단 고정 타이머 (타이머 동작 시에만 표시) — UX_SPEC §4.2/§9 -->
  <div id="timer-bar" class="timer-bar" hidden>⏱ <span id="timer-bar-time">00:00</span></div>

  <!-- 화면 유지용 무음 루프 video (타이머 동안 재생) — CLAUDE §5.2 -->
  <video id="keep-awake" muted playsinline loop hidden
         src="assets/video/keep-awake.mp4"
         style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none"></video>

  <!-- 알림음 (오디오 언락 후 재생) — DATA_SPEC §11 -->
  <audio id="rest-end-audio" src="assets/sounds/rest-end.mp3" preload="auto"></audio>

  <!-- 뷰 컨테이너: 탭에 따라 하나만 표시 -->
  <main id="app">
    <section id="view-today"  class="view"><!-- TODO(Phase1): 오늘 화면 (app.js) --></section>
    <section id="view-history" class="view" hidden><!-- TODO(Phase3): 기록 화면 --></section>
    <section id="view-guide"   class="view" hidden><!-- TODO(Phase3): 가이드/커스터마이징 --></section>
    <section id="view-ai"      class="view" hidden><!-- TODO(Phase4): AI 코치 --></section>
    <section id="view-settings" class="view" hidden><!-- TODO: 설정 (타이머·알림 테스트·백업) --></section>
  </main>

  <!-- 하단 네비게이션 (최대 5개) — UX_SPEC §2 -->
  <nav id="tabbar" class="tabbar">
    <button class="tab" data-view="today" aria-current="true">오늘</button>
    <button class="tab" data-view="history">기록</button>
    <button class="tab" data-view="guide">가이드</button>
    <button class="tab" data-view="ai">AI 코치</button>
    <button class="tab" data-view="settings">설정</button>
  </nav>

  <script>
    // iOS 홈화면 PWA 첫 실행 시 뷰포트가 상단 safe-area만큼 짧게 잡혀 fixed 하단 요소가 떠 있는 버그 보정.
    // 탭바의 실제 바닥과 화면 바닥 차이를 재서 --vp-gap 으로 내려준다. 정상 상태면 0.
    (function () {
      var root = document.documentElement, bar = document.getElementById("tabbar"), gap = 0, raf = 0;
      var standalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      function typing() { var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable); }
      function measure() {
        raf = 0;
        if (typing()) return;
        var portrait = window.innerHeight >= window.innerWidth;
        var screenH = standalone && portrait ? Math.max(screen.height, screen.width) : 0;
        var expected = Math.max(window.innerHeight, screenH);
        var natural = bar.getBoundingClientRect().bottom - gap;
        var next = Math.round(expected - natural);
        if (!(next > 0 && next <= 100)) next = 0;
        if (next !== gap) { gap = next; root.style.setProperty("--vp-gap", gap + "px"); }
        window.FitlogVP.gap = gap;
      }
      function schedule() { if (!raf) raf = requestAnimationFrame(measure); }
      window.FitlogVP = { gap: 0, measure: schedule };
      measure();
      ["resize", "orientationchange", "pageshow", "load", "scroll", "focusout"].forEach(function (ev) { window.addEventListener(ev, schedule, { passive: true }); });
      document.addEventListener("visibilitychange", schedule);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", schedule);
      [100, 300, 800, 1500, 3000].forEach(function (ms) { setTimeout(schedule, ms); });
    })();
  </script>

  <!-- 모듈 로드. 의존: db → evaluation → timer → backup → ai-bridge → app -->
  <script src="./db.js"></script>
  <script src="./evaluation.js"></script>
  <script src="./timer.js"></script>
  <script src="./backup.js"></script>
  <script src="./ai-bridge.js"></script>
  <script src="./catalog-data.js"></script>
  <script src="./heatmap.js"></script>
  <script src="./app.js"></script>
  <script>
    // Service Worker 등록 (배포 시 HTTPS 필요)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        if (navigator.serviceWorker.controller) {
          let refreshing = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => { if (refreshing) return; refreshing = true; window.location.reload(); });
        }
        navigator.serviceWorker.register("service-worker.js").then((reg) => {
          reg.update();
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          reg.addEventListener("updatefound", () => {
            const nw = reg.installing; if (!nw) return;
            nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) nw.postMessage({ type: "SKIP_WAITING" }); });
          });
        }).catch(console.error);
      });
    }
  </script>
</body>
</html>
